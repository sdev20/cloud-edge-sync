_format_version: "3.0"

services:
  - name: edge-sync-service
    # "edge-webapi" resolves via Docker's built-in DNS to the Edge.WebAPI
    # container on the shared "edge-network" defined in docker-compose.yml.
    url: http://edge-webapi:8080/api/instruments
    routes:
      - name: edge-sync-service-route
        paths:
          - /external/api/instruments
        strip_path: true
        methods:
          - POST

  - name: edge-sync-service-health
    url: http://edge-webapi:8080/api/instruments/health
    routes:
      - name: edge-sync-service-health-route
        paths:
          - /external/api/instruments/health
        strip_path: true
        methods:
          - GET

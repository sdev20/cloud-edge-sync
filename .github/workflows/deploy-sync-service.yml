name: Deploy SyncService.WebAPI

on:
  push:
    branches: [main]
    paths:
      - "SyncService.WebAPI/**"
      - ".github/workflows/deploy-sync-service.yml"
  workflow_dispatch:

env:
  ACR_NAME: cloudedgesyncacr
  IMAGE_NAME: sync-service-webapi
  RESOURCE_GROUP: cloud-edge-sync-rg
  WEBAPP_NAME: sync-service-webapi

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Log in to ACR
        run: |
          ACR_TOKEN=$(az acr login --name ${{ env.ACR_NAME }} --expose-token --output tsv --query accessToken)
          echo "$ACR_TOKEN" | docker login ${{ env.ACR_NAME }}.azurecr.io \
            --username 00000000-0000-0000-0000-000000000000 --password-stdin

      - name: Build and push image
        working-directory: SyncService.WebAPI
        run: |
          IMAGE_TAG=${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -t "$IMAGE_TAG" -f Dockerfile .
          docker push "$IMAGE_TAG"

      - name: Point App Service at the new image
        run: |
          MAIN_CONTAINER=$(az webapp sitecontainers list \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            -o json | jq -r '.[] | select(.properties.isMain == true or .isMain == true) | .name' | head -n1)

          if [ -z "$MAIN_CONTAINER" ]; then
            echo "Could not determine the existing main site container name" >&2
            exit 1
          fi
          echo "Main site container is: $MAIN_CONTAINER"

          az webapp sitecontainers update \
            --name ${{ env.WEBAPP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --container-name "$MAIN_CONTAINER" \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --target-port 8080 \
            --system-assigned-identity true

      - name: Restart App Service
        run: az webapp restart --name ${{ env.WEBAPP_NAME }} --resource-group ${{ env.RESOURCE_GROUP }}
